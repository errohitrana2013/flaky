<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* Rendered once at exactly 1200x630 and screenshotted. Dark on purpose: a
     share card competes in a feed, and the site's off-white would disappear
     against most of them. System fonts only — nothing to fetch at render time. */
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #100f0e;
    color: #ece9e1;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px;
    position: relative;
  }
  /* A faint version of the mark, bled off the right edge. Decoration that is
     still the logo rather than an abstract shape. */
  .ghostmark { position: absolute; right: -90px; bottom: -70px; width: 520px; opacity: .06; }

  .top { display: flex; align-items: center; gap: 18px; }
  .mark { width: 54px; height: 54px; }
  .word { font-size: 40px; font-weight: 700; letter-spacing: -.035em; }
  .word .dot { color: #fb923c; }

  h1 {
    font-size: 74px; line-height: 1.02; letter-spacing: -.04em; font-weight: 700;
    max-width: 15ch;
  }
  h1 em { font-style: normal; color: #fb923c; }

  .code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 27px; letter-spacing: -.01em;
    background: #1c1b19; border: 1px solid #2f2e2a;
    border-radius: 12px; padding: 20px 26px;
    display: inline-block; color: #cfccc2;
  }
  .code b { color: #fb923c; font-weight: 600; }

  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .url { font-size: 30px; font-weight: 600; letter-spacing: -.02em; color: #ece9e1; }
  .sub { font-size: 21px; color: #928f85; margin-top: 8px; }
</style></head><body>

  <svg class="ghostmark" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="3" y="18" width="5" height="9" rx="2.5" fill="#ece9e1"/>
    <rect x="10" y="12" width="5" height="15" rx="2.5" fill="#ece9e1"/>
    <rect x="17" y="22" width="5" height="5" rx="2.5" fill="#fb923c"/>
    <rect x="24" y="4" width="5" height="23" rx="2.5" fill="#ece9e1"/>
  </svg>

  <div class="top">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="18" width="5" height="9" rx="2.5" fill="#ece9e1"/>
      <rect x="10" y="12" width="5" height="15" rx="2.5" fill="#ece9e1"/>
      <rect x="17.6" y="8.6" width="4.8" height="11" rx="2.4" fill="none" stroke="#ece9e1" stroke-width="1.25" stroke-dasharray="2.5 2.5" opacity=".32"/>
      <rect x="17" y="22" width="5" height="5" rx="2.5" fill="#fb923c"/>
      <rect x="24" y="4" width="5" height="23" rx="2.5" fill="#ece9e1"/>
    </svg>
    <span class="word">flaky<span class="dot">.</span></span>
  </div>

  <h1>A mock REST API that <em>fails on purpose</em>.</h1>

  <div class="bottom">
    <div>
      <div class="url">flakyapi.dev</div>
      <div class="sub">Same data as JSONPlaceholder. Failures you can ask for.</div>
    </div>
    <div class="code">GET /v1/posts?<b>_status=503</b></div>
  </div>

</body></html>
