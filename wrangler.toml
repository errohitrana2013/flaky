# The Worker's name is the first label of the workers.dev URL, which is
# <worker>.<account-subdomain>.workers.dev — so "api" under the "flaky"
# subdomain gives api.flaky.workers.dev, and matches the api.flaky.dev shape a
# custom domain would take later. Naming it "flaky" here would double up.
name = "api"
main = "src/index.js"
compatibility_date = "2025-08-01"

# The Worker serves the site and the API from one host — assets outside /v1,
# API on /v1 — so the apex is the whole address and no api. subdomain is
# needed. That keeps every published code sample one label shorter.
#
# custom_domain = true makes Cloudflare create the DNS record and issue the
# certificate itself; there is nothing to add in the DNS tab by hand.
#
# workers_dev must be stated explicitly: declaring `routes` flips it off by
# default, which silently killed api.flaky.workers.dev on the first deploy of
# this block. That URL has already been shared, so it stays alive.
workers_dev = true

routes = [
  { pattern = "flakyapi.dev", custom_domain = true },
  { pattern = "www.flakyapi.dev", custom_domain = true },
]

# Everything outside /v1 is the static site. index.js falls through to this
# binding, so the landing page and docs are served from the same Worker and
# there is no second deploy target to keep in sync.
[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "flaky"
database_id = "2a724332-4697-4998-868a-0dd8517a6cfb"
# Lets `wrangler d1 migrations apply` track what has already run, so a schema
# change is a new 000N_*.sql file and never a hand-run statement.
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "0d942a0caef542ce8494cf5cafd857f5"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "flaky_requests"

# 03:00 UTC: purge expired sandboxes, post yesterday's digest.
[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true

# Secrets are NOT set here — they go in .dev.vars locally and
# `wrangler secret put` in production:
#   VISITOR_SALT     long random string; rotating it resets visitor identity
#   ADMIN_TOKEN      guards /v1/admin/stats and dashboard.html
#   DIGEST_WEBHOOK   optional Slack/Discord webhook for the nightly summary
