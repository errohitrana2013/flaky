<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="flaky">
  <!-- Signal bars with one dropped out. Simplified against logo.svg: no ghost
       outline and fatter bars, because at 16px anything finer turns to mush. -->
  <style>
    .bar  { fill: #16150f; }
    .flake { fill: #c2410c; }
    @media (prefers-color-scheme: dark) {
      .bar  { fill: #eceae1; }
      .flake { fill: #fb923c; }
    }
  </style>
  <rect class="bar"   x="2"  y="18" width="6" height="9"  rx="3"/>
  <rect class="bar"   x="10" y="12" width="6" height="15" rx="3"/>
  <rect class="flake" x="18" y="21" width="6" height="6"  rx="3"/>
  <rect class="bar"   x="26" y="4"  width="6" height="23" rx="3"/>
</svg>
