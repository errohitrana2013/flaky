<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>flaky — traffic</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #fbfbf9; --panel: #fff; --ink: #16150f; --muted: #6b6a60;
    --line: #e5e4de; --accent: #c2410c; --bar: #d4d2c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --panel: #1a1a18; --ink: #eceae1; --muted: #918f84;
      --line: #2b2b28; --accent: #fb923c; --bar: #3a3a35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  /* Static here — a looping animation next to live numbers reads as a chart
     updating when it is not. */
  .mark { width: 24px; height: 24px; display: block; }
  .mark .bar { fill: currentColor; }
  .mark .flake { fill: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 32px; }

  .gate { display: flex; gap: 8px; max-width: 460px; }
  input {
    flex: 1; font: 14px/1 ui-monospace, monospace; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink);
  }
  button {
    font: 600 13px/1 inherit; padding: 11px 18px; border: 0;
    border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
  }
  .err { color: var(--accent); font-size: 14px; margin-top: 10px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 16px 18px; }
  .tile .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .tile .v { font-size: 27px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }

  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 32px 0 12px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: ui-monospace, monospace; font-size: 13px; }

  /* A bar per day, drawn with a div. No chart library for six numbers. */
  .track { background: var(--bar); height: 7px; border-radius: 4px; min-width: 2px; }
  .track.err { background: var(--accent); }
  td.chart { width: 45%; }

  /* Hour-of-day histogram. 24 columns on a flex row, heights as percentages —
     still no chart library. */
  .tzlabel { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .hours {
    display: flex; align-items: flex-end; gap: 3px; height: 110px;
    padding: 12px 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 11px;
  }
  .hour { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 5px; }
  .hour .col { background: var(--bar); border-radius: 3px 3px 0 0; min-height: 2px; transition: background .12s; }
  .hour.peak .col { background: var(--accent); }
  .hour .lab { font-size: 9.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; height: 12px; }
  .hour .lab.hide { visibility: hidden; }
  .hour:hover .col { background: var(--accent); }

  .flag { font-size: 15px; margin-right: 7px; }
  .code { color: var(--muted); font-size: 12px; }

  /* CSV links sit in the section headings, so the download is next to the
     table it came from rather than in a menu somewhere. */
  h2 { display: flex; align-items: center; gap: 10px; }
  .csv {
    margin-left: auto; font-size: 11px; letter-spacing: .04em; font-weight: 600;
    color: var(--muted); background: none; border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 6px; cursor: pointer; text-transform: uppercase;
  }
  .csv:hover { color: var(--accent); border-color: var(--accent); }
  .csv:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<div class="wrap">
  <h1>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect class="bar"   x="3"  y="18" width="5" height="9"  rx="2.5"/>
      <rect class="bar"   x="10" y="12" width="5" height="15" rx="2.5"/>
      <rect class="flake" x="17" y="22" width="5" height="5"  rx="2.5"/>
      <rect class="bar"   x="24" y="4"  width="5" height="23" rx="2.5"/>
    </svg>
    flaky · traffic
  </h1>
  <p class="sub">Reads the D1 rollups. Your token is kept in sessionStorage and never leaves this tab.</p>

  <div id="gate" class="gate">
    <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
    <button id="go">Load</button>
  </div>
  <div id="error" class="err" hidden></div>

  <div id="panel" hidden>
    <div class="tiles">
      <div class="tile"><div class="k">Requests</div><div class="v" id="t-req">—</div></div>
      <div class="tile"><div class="k">Visitors</div><div class="v" id="t-vis">—</div></div>
      <div class="tile"><div class="k">Error rate</div><div class="v" id="t-err">—</div></div>
      <div class="tile"><div class="k">Keys issued</div><div class="v" id="t-key">—</div></div>
    </div>

    <h2>Per day <button class="csv" data-csv="daily">csv</button></h2>
    <table>
      <thead><tr><th>Day</th><th class="num">Requests</th><th class="num">Errors</th><th class="num">Visitors</th><th class="chart"></th></tr></thead>
      <tbody id="daily"></tbody>
    </table>

    <h2>When people use it <span id="tz" class="tzlabel"></span> <button class="csv" data-csv="hourly">csv</button></h2>
    <div id="hours" class="hours"></div>

    <h2>Where they come from <button class="csv" data-csv="countries">csv</button></h2>
    <table>
      <thead><tr><th>Region</th><th class="num">Visitors</th><th class="num">Requests</th><th class="chart"></th></tr></thead>
      <tbody id="geo"></tbody>
    </table>

    <h2>Busiest keys <button class="csv" data-csv="keys">csv</button></h2>
    <table>
      <thead><tr><th>Key id</th><th class="num">Requests</th></tr></thead>
      <tbody id="keys"></tbody>
    </table>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const num = (n) => Number(n || 0).toLocaleString();

async function load(token) {
  const res = await fetch("/v1/admin/stats?days=14", {
    headers: { authorization: "Bearer " + token },
  });
  if (!res.ok) throw new Error(res.status === 401 ? "Token rejected." : "Request failed: " + res.status);
  return res.json();
}

function render(data) {
  $("t-req").textContent = num(data.totals.requests);
  $("t-err").textContent = (data.totals.errorRate * 100).toFixed(1) + "%";
  $("t-key").textContent = num(data.totals.keysIssued);

  const visitorsByDay = Object.fromEntries(data.visitors.map((v) => [v.day, v.visitors]));
  $("t-vis").textContent = num(data.visitors.reduce((s, v) => s + v.visitors, 0));

  const peak = Math.max(1, ...data.daily.map((d) => d.requests || 0));
  $("daily").innerHTML = data.daily.length
    ? data.daily
        .map((d) => `<tr>
            <td class="mono">${d.day}</td>
            <td class="num">${num(d.requests)}</td>
            <td class="num">${num(d.errors)}</td>
            <td class="num">${num(visitorsByDay[d.day])}</td>
            <td class="chart"><div class="track${d.errors > d.requests * 0.1 ? " err" : ""}"
              style="width:${((d.requests / peak) * 100).toFixed(1)}%"></div></td>
          </tr>`)
        .join("")
    : '<tr><td colspan="5" style="color:var(--muted)">No traffic yet.</td></tr>';

  renderHours(data.hourly);
  renderGeo(data.countries);

  $("keys").innerHTML = data.topKeys.length
    ? data.topKeys.map((k) => `<tr><td class="mono">${k.key_id}</td><td class="num">${num(k.requests)}</td></tr>`).join("")
    : '<tr><td colspan="2" style="color:var(--muted)">No keyed traffic yet.</td></tr>';

  $("gate").hidden = true;
  $("panel").hidden = false;
}

// The API stores hours in UTC. "When should I ship" is a local-time question,
// so shift into the viewer's zone here. India and friends sit on a half-hour
// offset, hence the fractional maths rather than a plain integer rotate.
function renderHours(hourly) {
  const offset = -new Date().getTimezoneOffset() / 60;
  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  $("tz").textContent = zone ? `· ${zone}` : "· local time";

  const label = (v) => {
    const hh = Math.floor(v);
    return `${String(hh).padStart(2, "0")}:${String(Math.round((v - hh) * 60)).padStart(2, "0")}`;
  };

  const buckets = hourly
    .map((b) => ({ ...b, local: (((b.hour + offset) % 24) + 24) % 24 }))
    .sort((a, b) => a.local - b.local);

  const peak = Math.max(...buckets.map((b) => b.requests));

  $("hours").innerHTML = buckets
    .map((b, i) => {
      const height = peak ? Math.max((b.requests / peak) * 100, 1.5) : 1.5;
      // Every third label only; 24 of them overlap on a phone.
      return `<div class="hour${b.requests === peak && peak > 0 ? " peak" : ""}"
                   title="${label(b.local)}–${label((b.local + 1) % 24)} · ${num(b.requests)} requests, ${num(b.errors)} errors">
        <div class="col" style="height:${height.toFixed(1)}%"></div>
        <div class="lab${i % 3 ? " hide" : ""}">${label(b.local).slice(0, 2)}</div>
      </div>`;
    })
    .join("");
}

// Codes come from Cloudflare, but they round-trip through the database, so
// validate the shape before building a flag or trusting it in markup.
const REGION = (() => {
  try { return new Intl.DisplayNames(["en"], { type: "region" }); } catch { return null; }
})();

const isCode = (code) => /^[A-Za-z]{2}$/.test(code || "");

function countryName(code) {
  if (!isCode(code) || code.toUpperCase() === "XX") return "Unknown";
  try { return REGION?.of(code.toUpperCase()) || code.toUpperCase(); } catch { return code.toUpperCase(); }
}

function flag(code) {
  if (!isCode(code) || code.toUpperCase() === "XX") return "🌐";
  return String.fromCodePoint(...[...code.toUpperCase()].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
}

function renderGeo(countries) {
  if (!countries.length) {
    $("geo").innerHTML = '<tr><td colspan="4" style="color:var(--muted)">No regions recorded yet.</td></tr>';
    return;
  }
  const peak = Math.max(...countries.map((c) => c.requests));
  $("geo").innerHTML = countries
    .map((c) => `<tr>
        <td><span class="flag">${flag(c.country)}</span>${countryName(c.country)}
            <span class="code">${isCode(c.country) ? c.country.toUpperCase() : ""}</span></td>
        <td class="num">${num(c.visitors)}</td>
        <td class="num">${num(c.requests)}</td>
        <td class="chart"><div class="track" style="width:${((c.requests / peak) * 100).toFixed(1)}%"></div></td>
      </tr>`)
    .join("");
}

// Held in memory only, for the export requests. It still needs the admin
// header, so the download cannot be a plain link.
let authToken = null;

async function attempt(token) {
  $("error").hidden = true;
  try {
    render(await load(token));
    authToken = token;
    sessionStorage.setItem("flaky_admin", token);
  } catch (err) {
    authToken = null;
    sessionStorage.removeItem("flaky_admin");
    $("error").textContent = err.message;
    $("error").hidden = false;
  }
}

// The export window is deliberately wider than the dashboard's 14 days —
// someone downloading a spreadsheet is looking for a trend, not today.
async function downloadCsv(button) {
  const dataset = button.dataset.csv;
  button.disabled = true;
  try {
    const res = await fetch(`/v1/admin/export?dataset=${dataset}&days=90`, {
      headers: { authorization: "Bearer " + authToken },
    });
    if (!res.ok) throw new Error("Export failed: " + res.status);

    // Prefer the filename the server chose, so the date in it is the server's.
    const disposition = res.headers.get("content-disposition") || "";
    const named = disposition.match(/filename="([^"]+)"/);

    const url = URL.createObjectURL(await res.blob());
    const link = Object.assign(document.createElement("a"), {
      href: url,
      download: named ? named[1] : `flaky-${dataset}.csv`,
    });
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    $("error").textContent = err.message;
    $("error").hidden = false;
  } finally {
    button.disabled = false;
  }
}

for (const button of document.querySelectorAll(".csv")) {
  button.addEventListener("click", () => downloadCsv(button));
}

$("go").addEventListener("click", () => attempt($("token").value.trim()));
$("token").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });

// sessionStorage can throw in a private window; a failed read just shows the gate.
try {
  const saved = sessionStorage.getItem("flaky_admin");
  if (saved) attempt(saved);
} catch {}
</script>
</body>
</html>
