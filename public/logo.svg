<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="flaky">
  <!-- Ascending signal bars, except the third has dropped to a stub. Signal
       strength is already the universal shorthand for "is this connection
       reliable", so the broken bar reads as intermittent failure without
       needing explanation — which is the whole product.

       The dashed outline shows the height that bar should have reached. It is
       the detail that makes the mark legible as *dropped* rather than merely
       short, so it stays here and is dropped from favicon.svg, where it would
       not survive 16px. -->
  <style>
    .bar   { fill: #16150f; }
    .flake { fill: #c2410c; }
    .ghost { fill: none; stroke: #16150f; stroke-width: 1.25; stroke-dasharray: 2.5 2.5; opacity: .32; }
    @media (prefers-color-scheme: dark) {
      .bar   { fill: #eceae1; }
      .flake { fill: #fb923c; }
      .ghost { stroke: #eceae1; }
    }
  </style>
  <rect class="bar"   x="3"  y="18" width="5" height="9"  rx="2.5"/>
  <rect class="bar"   x="10" y="12" width="5" height="15" rx="2.5"/>
  <rect class="ghost" x="17.6" y="8.6" width="4.8" height="11" rx="2.4"/>
  <rect class="flake" x="17" y="22" width="5" height="5"  rx="2.5"/>
  <rect class="bar"   x="24" y="4"  width="5" height="23" rx="2.5"/>
</svg>
